name: Backend CI
run-name: Backend CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "services/authorization-service/**"
      - "services/policy-service/**"
      - "services/claims-billing-service/**"
      - "services/notification-worker/**"
      - "services/search-service/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "services/authorization-service/**"
      - "services/policy-service/**"
      - "services/claims-billing-service/**"
      - "services/notification-worker/**"
      - "services/search-service/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  service:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service:
          - authorization-service
          - policy-service
          - claims-billing-service
          - notification-worker
          - search-service

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record immutable source revision
        run: |
          test "${#GITHUB_SHA}" -eq 40
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: services/${{ matrix.service }}/pom.xml

      - name: Verify application
        run: ./mvnw --batch-mode --no-transfer-progress verify
        working-directory: services/${{ matrix.service }}
