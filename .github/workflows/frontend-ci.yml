name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/operations-portal/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/operations-portal/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  operations-portal:
    name: Operations portal
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/operations-portal

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/operations-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
