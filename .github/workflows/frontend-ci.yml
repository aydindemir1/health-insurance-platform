name: Frontend CI
run-name: Frontend CI · ${{ github.ref_name }} · ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "apps/operations-portal/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/operations-portal/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  operations-portal:
    name: Operations portal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/operations-portal

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Record immutable source revision
        run: |
          test "${#GITHUB_SHA}" -eq 40
          echo "Source revision: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/operations-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build:budget
