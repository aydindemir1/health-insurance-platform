services:
  apisix:
    image: apache/apisix:3.18.0-debian
    environment:
      APISIX_OIDC_CLIENT_SECRET: ${APISIX_OIDC_CLIENT_SECRET:-jwks-validation-compatibility-value}
    ports:
      - "9080:9080"
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
      - ./infra/apisix/plugins/problem-details.lua:/usr/local/apisix/apisix/plugins/problem-details.lua:ro
    healthcheck:
      test: ["CMD-SHELL", "apisix status"]
      interval: 5s
      timeout: 5s
      retries: 20
    depends_on:
      keycloak:
        condition: service_started
      authorization-service:
        condition: service_started
      policy-service:
        condition: service_started
      claims-billing-service:
        condition: service_started
      search-service:
        condition: service_started

  redis:
    image: redis:8.2.9-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: local-development-only-32-char-key
    ports:
      - "127.0.0.1:5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy

  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.3
    command:
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
      - -E
      - setup.kibana.host=http://kibana:5601
    ports:
      - "127.0.0.1:8200:8200"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kibana:
        condition: service_started

  kafka:
    image: apache/kafka-native:4.1.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 19092"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-cli:
    image: apache/kafka:4.1.1
    profiles: [tools]
    entrypoint: ["/bin/sh", "-c"]
    command: ["exit 0"]

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  authorization-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: authorization
      POSTGRES_USER: ${AUTHORIZATION_DB_USERNAME:?Set AUTHORIZATION_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?Set AUTHORIZATION_DB_PASSWORD in .env}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - authorization-db-data:/var/lib/postgresql/data

  policy-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: policy
      POSTGRES_USER: ${POLICY_DB_USERNAME:?Set POLICY_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${POLICY_DB_PASSWORD:?Set POLICY_DB_PASSWORD in .env}
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - policy-db-data:/var/lib/postgresql/data

  claims-billing-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: claims_billing
      POSTGRES_USER: ${CLAIMS_BILLING_DB_USERNAME:?Set CLAIMS_BILLING_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${CLAIMS_BILLING_DB_PASSWORD:?Set CLAIMS_BILLING_DB_PASSWORD in .env}
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - claims-billing-db-data:/var/lib/postgresql/data

  notification-worker-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notification_worker
      POSTGRES_USER: ${NOTIFICATION_DB_USERNAME:?Set NOTIFICATION_DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - notification-worker-db-data:/var/lib/postgresql/data

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME in .env}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in .env}
    ports:
      - "8080:8080"
    volumes:
      - ./infra/keycloak/health-insurance-realm.json:/opt/keycloak/data/import/health-insurance-realm.json:ro

  authorization-service:
    build: services/authorization-service
    environment:
      DB_URL: jdbc:postgresql://authorization-db:5432/authorization
      DB_USERNAME: ${AUTHORIZATION_DB_USERNAME:?Set AUTHORIZATION_DB_USERNAME in .env}
      DB_PASSWORD: ${AUTHORIZATION_DB_PASSWORD:?Set AUTHORIZATION_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/health-insurance
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/health-insurance/protocol/openid-connect/certs
      POLICY_SERVICE_BASE_URL: http://policy-service:8082
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      NOTIFICATION_OUTBOX_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      JAVA_TOOL_OPTIONS: -javaagent:/app/elastic-apm-agent.jar
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SERVICE_NAME: authorization-service
      ELASTIC_APM_ENVIRONMENT: local
      ELASTIC_APM_APPLICATION_PACKAGES: com.aydindemir.health.authorization
    expose:
      - "8081"
    depends_on:
      authorization-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      policy-service:
        condition: service_started
      kafka:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      apm-server:
        condition: service_started

  policy-service:
    build: services/policy-service
    environment:
      DB_URL: jdbc:postgresql://policy-db:5432/policy
      DB_USERNAME: ${POLICY_DB_USERNAME:?Set POLICY_DB_USERNAME in .env}
      DB_PASSWORD: ${POLICY_DB_PASSWORD:?Set POLICY_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/health-insurance
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/health-insurance/protocol/openid-connect/certs
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COVERAGE_CACHE_TTL: 30s
      JAVA_TOOL_OPTIONS: -javaagent:/app/elastic-apm-agent.jar
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SERVICE_NAME: policy-service
      ELASTIC_APM_ENVIRONMENT: local
      ELASTIC_APM_APPLICATION_PACKAGES: com.aydindemir.health.policy
    expose:
      - "8082"
    depends_on:
      policy-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      apm-server:
        condition: service_started

  claims-billing-service:
    build: services/claims-billing-service
    environment:
      DB_URL: jdbc:postgresql://claims-billing-db:5432/claims_billing
      DB_USERNAME: ${CLAIMS_BILLING_DB_USERNAME:?Set CLAIMS_BILLING_DB_USERNAME in .env}
      DB_PASSWORD: ${CLAIMS_BILLING_DB_PASSWORD:?Set CLAIMS_BILLING_DB_PASSWORD in .env}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/health-insurance
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/health-insurance/protocol/openid-connect/certs
      AUTHORIZATION_SERVICE_BASE_URL: http://authorization-service:8081
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      CLAIM_SEARCH_OUTBOX_ENABLED: "true"
      JAVA_TOOL_OPTIONS: -javaagent:/app/elastic-apm-agent.jar
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SERVICE_NAME: claims-billing-service
      ELASTIC_APM_ENVIRONMENT: local
      ELASTIC_APM_APPLICATION_PACKAGES: com.aydindemir.health.claims
    expose:
      - "8083"
    depends_on:
      claims-billing-db:
        condition: service_healthy
      keycloak:
        condition: service_started
      authorization-service:
        condition: service_started
      kafka:
        condition: service_healthy
      apm-server:
        condition: service_started

  notification-worker:
    build: services/notification-worker
    environment:
      DB_URL: jdbc:postgresql://notification-worker-db:5432/notification_worker
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?Set NOTIFICATION_DB_USERNAME in .env}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:?Set RABBITMQ_USERNAME in .env}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      NOTIFICATION_LISTENER_ENABLED: "true"
      NOTIFICATION_SENDER_MODE: log
      JAVA_TOOL_OPTIONS: -javaagent:/app/elastic-apm-agent.jar
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SERVICE_NAME: notification-worker
      ELASTIC_APM_ENVIRONMENT: local
      ELASTIC_APM_APPLICATION_PACKAGES: com.aydindemir.health.notification
    depends_on:
      notification-worker-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      apm-server:
        condition: service_started

  search-service:
    build: services/search-service
    environment:
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SEARCH_KAFKA_CONSUMER_ENABLED: "true"
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/health-insurance
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/health-insurance/protocol/openid-connect/certs
      JAVA_TOOL_OPTIONS: -javaagent:/app/elastic-apm-agent.jar
      ELASTIC_APM_SERVER_URL: http://apm-server:8200
      ELASTIC_APM_SERVICE_NAME: search-service
      ELASTIC_APM_ENVIRONMENT: local
      ELASTIC_APM_APPLICATION_PACKAGES: com.aydindemir.health.search
    expose:
      - "8084"
    depends_on:
      elasticsearch:
        condition: service_healthy
      kafka:
        condition: service_healthy
      keycloak:
        condition: service_started
      apm-server:
        condition: service_started

volumes:
  authorization-db-data:
  policy-db-data:
  claims-billing-db-data:
  notification-worker-db-data:
  rabbitmq-data:
  redis-data:
  elasticsearch-data:
