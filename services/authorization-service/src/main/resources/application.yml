server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: authorization-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/authorization}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/health-insurance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/health-insurance/protocol/openid-connect/certs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

clients:
  policy-service:
    base-url: ${POLICY_SERVICE_BASE_URL:http://localhost:8082}
    connect-timeout: ${POLICY_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${POLICY_SERVICE_READ_TIMEOUT:3s}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  messaging:
    outbox:
      enabled: ${OUTBOX_ENABLED:true}
      fixed-delay: ${OUTBOX_FIXED_DELAY:1s}
      batch-size: ${OUTBOX_BATCH_SIZE:50}
      send-timeout: ${OUTBOX_SEND_TIMEOUT:5s}
    notification-outbox:
      enabled: ${NOTIFICATION_OUTBOX_ENABLED:false}
      fixed-delay: ${NOTIFICATION_OUTBOX_FIXED_DELAY:1s}
      batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
      confirm-timeout: ${NOTIFICATION_OUTBOX_CONFIRM_TIMEOUT:5s}
