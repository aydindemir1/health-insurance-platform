databaseChangeLog:
  - changeSet:
      id: 001-create-pre-authorizations
      author: aydin-demir
      changes:
        - createTable:
            tableName: pre_authorizations
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: member_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: provider_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: policy_number
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: diagnosis_code
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: requested_amount
                  type: DECIMAL(19,2)
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: CHAR(3)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: decision_reason
                  type: VARCHAR(500)
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
              - column:
                  name: decided_at
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - createIndex:
            tableName: pre_authorizations
            indexName: idx_pre_auth_member_created
            columns:
              - column:
                  name: member_id
              - column:
                  name: created_at
        - createIndex:
            tableName: pre_authorizations
            indexName: idx_pre_auth_status
            columns:
              - column:
                  name: status
