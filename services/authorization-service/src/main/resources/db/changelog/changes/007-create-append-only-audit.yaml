databaseChangeLog:
  - changeSet:
      id: 007-create-append-only-audit
      author: aydin-demir
      changes:
        - createTable:
            tableName: audit_records
            columns:
              - column:
                  name: audit_id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: aggregate_type
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: aggregate_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: actor_subject
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: actor_roles
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: provider_id
                  type: uuid
              - column:
                  name: correlation_id
                  type: varchar(128)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: reason_code
                  type: varchar(64)
                  constraints:
                    nullable: false
              - column:
                  name: changes
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: retention_class
                  type: varchar(64)
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_records
            indexName: idx_audit_aggregate
            columns:
              - column:
                  name: aggregate_type
              - column:
                  name: aggregate_id
              - column:
                  name: occurred_at
        - createIndex:
            tableName: audit_records
            indexName: idx_audit_occurred_at
            columns:
              - column:
                  name: occurred_at
        - sql:
            sql: |
              ALTER TABLE audit_records
              ADD CONSTRAINT chk_audit_changes_allowlist
              CHECK ((changes - 'fromStatus' - 'toStatus') = '{}'::jsonb);
        - sql:
            splitStatements: false
            sql: |
              CREATE FUNCTION reject_audit_record_mutation()
              RETURNS trigger AS $$
              BEGIN
                  RAISE EXCEPTION 'audit_records is append-only';
              END;
              $$ LANGUAGE plpgsql;
        - sql:
            sql: |
              CREATE TRIGGER audit_records_append_only
              BEFORE UPDATE OR DELETE OR TRUNCATE ON audit_records
              FOR EACH STATEMENT EXECUTE FUNCTION reject_audit_record_mutation();
      rollback:
        - dropTable:
            tableName: audit_records
        - sql:
            sql: DROP FUNCTION IF EXISTS reject_audit_record_mutation();
