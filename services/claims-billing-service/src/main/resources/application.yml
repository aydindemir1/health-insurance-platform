server:
  port: 8083
  shutdown: graceful

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:ecs}

spring:
  application:
    name: claims-billing-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/claims_billing}
    username: ${DB_USERNAME:claims_billing_app}
    password: ${DB_PASSWORD:local-development-only}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/health-insurance}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/health-insurance/protocol/openid-connect/certs}

clients:
  authorization-service:
    base-url: ${AUTHORIZATION_SERVICE_BASE_URL:http://localhost:8081}
    connect-timeout: ${AUTHORIZATION_SERVICE_CONNECT_TIMEOUT:2s}
    read-timeout: ${AUTHORIZATION_SERVICE_READ_TIMEOUT:3s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  messaging:
    consumer:
      enabled: ${KAFKA_CONSUMER_ENABLED:true}
      retry-delay: ${KAFKA_RETRY_DELAY:1s}
      max-attempts: ${KAFKA_MAX_ATTEMPTS:3}
    search-outbox:
      enabled: ${CLAIM_SEARCH_OUTBOX_ENABLED:false}
      fixed-delay: ${CLAIM_SEARCH_OUTBOX_FIXED_DELAY:1s}
      batch-size: ${CLAIM_SEARCH_OUTBOX_BATCH_SIZE:50}
      send-timeout: ${CLAIM_SEARCH_OUTBOX_SEND_TIMEOUT:5s}
