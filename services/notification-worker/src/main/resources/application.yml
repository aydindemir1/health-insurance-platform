spring:
  application:
    name: notification-worker
  main:
    web-application-type: none
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/notification_worker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

app:
  messaging:
    rabbit-listener:
      enabled: ${NOTIFICATION_LISTENER_ENABLED:false}
  notification:
    sender:
      mode: ${NOTIFICATION_SENDER_MODE:log}
