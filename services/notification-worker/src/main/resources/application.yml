spring:
  application:
    name: notification-worker
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5436/notification_worker}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    listener:
      simple:
        acknowledge-mode: manual
        default-requeue-rejected: false

logging:
  structured:
    format:
      console: ${CONSOLE_LOG_FORMAT:ecs}

server:
  port: 8085
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  messaging:
    rabbit-listener:
      enabled: ${NOTIFICATION_LISTENER_ENABLED:false}
      retry:
        max-attempts: ${NOTIFICATION_RETRY_MAX_ATTEMPTS:3}
        initial-interval: ${NOTIFICATION_RETRY_INITIAL_INTERVAL:250ms}
        multiplier: ${NOTIFICATION_RETRY_MULTIPLIER:2.0}
        max-interval: ${NOTIFICATION_RETRY_MAX_INTERVAL:2s}
  notification:
    sender:
      mode: ${NOTIFICATION_SENDER_MODE:log}
