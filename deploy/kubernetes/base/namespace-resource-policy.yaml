apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 24Gi
    limits.cpu: "50"
    limits.memory: 48Gi
    pods: "50"
    count/configmaps: "50"
    count/secrets: "50"
    count/services: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: container-guardrails
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 2Gi
