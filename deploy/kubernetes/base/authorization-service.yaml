apiVersion: apps/v1
kind: Deployment
metadata:
  name: authorization-service
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: authorization-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: authorization-service
        app.kubernetes.io/component: backend
    spec:
      serviceAccountName: authorization-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: authorization-service
      containers:
        - name: application
          image: health-insurance/authorization-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: platform-runtime
          env:
            - name: DB_URL
              value: jdbc:postgresql://authorization-postgres.platform-dependencies.svc.cluster.local:5432/authorization
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authorization-db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authorization-db-credentials
                  key: password
            - name: SPRING_RABBITMQ_USERNAME
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: username
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-credentials
                  key: password
            - name: NOTIFICATION_OUTBOX_ENABLED
              value: "true"
            - name: JAVA_TOOL_OPTIONS
              value: -javaagent:/app/elastic-apm-agent.jar -XX:+ExitOnOutOfMemoryError -XX:MaxRAMPercentage=75
            - name: ELASTIC_APM_SERVICE_NAME
              value: authorization-service
            - name: ELASTIC_APM_APPLICATION_PACKAGES
              value: com.aydindemir.health.authorization
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 384Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: authorization-service
spec:
  selector:
    app.kubernetes.io/name: authorization-service
  ports:
    - name: http
      port: 8081
      targetPort: http
