apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-local-docker-desktop-dependencies
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, worker]
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - { protocol: TCP, port: 5433 }
        - { protocol: TCP, port: 5434 }
        - { protocol: TCP, port: 5435 }
        - { protocol: TCP, port: 5436 }
